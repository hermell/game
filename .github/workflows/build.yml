name: Build APK

on:
  push:
    branches: ["claude/gifted-mccarthy-EtjeA", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Android SDK 경로 설정
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: APK 빌드
        run: gradle :app:assembleDebug --stacktrace

      - name: APK 업로드 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartBudget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 최신 릴리즈로 배포
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "자동 빌드된 최신 APK"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: 텔레그램 알림
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ SmartBudget 빌드 완료%0A업데이트 준비됐어요! update.bat 실행하세요."
          else
            MSG="❌ SmartBudget 빌드 실패%0AGitHub Actions를 확인해주세요.%0Ahttps://github.com/hermell/game/actions"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"
